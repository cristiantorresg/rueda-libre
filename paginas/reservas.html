<head>
    <meta charset="UTF-8">

 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="..\index.html">Inicio</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
                <li><a href="reservas.html">Reservas</a></li>  
            </ul>
            
        </nav>
        <img src="..\img\logo.png" alt="Logo de Rueda Libre"> 
    </header>
    <main>
    <h1>Reserva tu bicicleta</h1>
    
    <form action="" method="post">
        <fieldset>
            <legend>Tus datos</legend>
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required minlength="3" pattern="[A-Za-zÁéíóúÁÉÍÓÚñÑ ]+>">
            <label for="documento">Documento de identificación</label>
            <input type="number" id="documento" name="documento" required minlength="6" maxlength="10">
            <label for="email"> Correo electronico</label>
            <input type="email" id="email" name="email" required >
            <label for="celular">Celular</label>
            <input type="tel" id="celular" name="celular" required maxlength="10" pattern="3.{9}" inputmode="numeric"
            placeholder="Ej: 3004321221">
        </fieldset>
        <fieldset>
            <legend>Tu alquiler</legend>
        <label for="fecha">Fecha del alquiler</label>
        <input type="date" id="fecha" name="fecha" 
        max="2026-12-31" min="2026-11-01" required>
        <label for="tipobicicleta">Tipo de bicicleta</label>
        <select id="tipobicicleta" name="tipobicicleta" required>
        <option value="urbana">Urbana</option>
        <option value="montaña">Montaña</option>
        <option value="electrica">Electrica</option>
        </select>
        <label for="plan">Plan</label>
        <select id="plan" name="plan">
        <option value="1 hora">1 hora</option>
        <option value="mediodia">Medio día</option>
        <option value="diacompleto">Día completo</option>
        </select>
        <label for="cantidadbicicletas">Cantidad de bicicletas</label>
        <select id="cantidadbicicletas" name="cantidadbicicletas" required>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        </select>
        <label for="recorridoguiado">Recorrido guiado</label>
        <select name="recorridoguiado" id="recorridoguiado">
        <option value="ninguno">Ninguno</option>
        <option value="ruta1">Ruta 1</option>
        <option value="ruta2">Ruta 2</option>
        <option value="ruta3">Ruta 3</option>
        </select>
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" name="comentarios" rows="4" maxlength="300" placeholder="Escribe aquí tus comentarios adicionales."></textarea>
        </fieldset>
        <fieldset>
            <legend>Confirmación</legend>
        <label for="aceptacionpoliticas">Aceptas nuestras politicas de alquiler </label>
        <input type="checkbox" id="aceptacionpoliticas" name="aceptacionpoliticas" required>
        </fieldset>
        <button type="submit">Enviar información</button>
    
    </form>
    
    <h2>Horario atención</h2>
    <dl>    
    <dt>Lunes - Viernes </dt>   
    <dd>7:00 am a 7:00 pm</dd>
    <dt>sábados, domingos y festivos</dt>
    <dd>6:00 am a 2:00 pm</dd>
    </dl>
    </main>

</html>
