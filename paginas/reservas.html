<!DOCTYPE html>
<html lang="es>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="..\index.html">Inicio</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
                <li><a href="reservas.html">Reservas</a></li>
             <img src="..\img\logo.jpeg" alt="Logo de Rueda Libre" style="display: block; margin: 0 auto; width: 500px;">   
            </ul>
        </nav>
    </header>
    <main>
    <h1>Reserva tu bicicleta</h1>
    
    <form action="" method="post">
        <fieldset>
            <legend>Tus datos</legend>
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="celular">Celular</label>
        <input type="number" id="celular" name="celular" required>
        </fieldset>
        <fieldset>
            <legend>Tu alquiler</legend>
        <label for="fecha">Fecha del alquiler</label>
        <input type="date" id="fecha" name="fecha" required>
        <label for="tipobicicleta">Tipo de bicicleta</label>
        <select id="tipobicicleta" name="tipobicicleta">
        <option value="urbana">Urbana</option>
        <option value="montaña">Montaña</option>
        <option value="electrica">Electrica</option>
        </select>
        <label for="plan">Plan</label>
        <select id="plan" name="plan">
        <option value="1 hora">1 hora</option>
        <option value="mediodia">Medio día</option>
        <option value="diacompleto">Día completo</option>
        </select>
        <label for="cantidadbicicletas">Cantidad de bicicletas</label>
        <select id="cantidadbicicletas" name="cantidadbicicletas">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        </select>
        <label for="recorridoguiado">Recorrido guiado</label>
        <select name="recorridoguiado" id="recorridoguiado">
        <option value="ninguno">Ninguno</option>
        <option value="ruta1">Ruta 1</option>
        <option value="ruta2">Ruta 2</option>
        <option value="ruta3">Ruta 3</option>
        </select>
        <label for="comentarios"> Comentarios </label>
        <input type="text" id="comentarios" name="comentarios" >
        </fieldset>
        <fieldset>
            <legend>Confirmación</legend>
        <label for="aceptacionpoliticas">Aceptas nuestras politicas de alquiler </label>
        <input type="checkbox" id="aceptacionpoliticas" name="aceptacionpoliticas">
        </fieldset>
        <button type="submit">Enviar información</button>
    
    </form>
    <dl>
        <h2>Horario atención</h2>
    <dt>Lunes - Viernes </dt>   
    <dd>7:00 am a 7:00 pm</dd>
    <dt>sábados, domingos y festivos</dt>
    <dd>6:00 am a 2:00 pm</dd>
    </dl>
    </main>

</footer>
</body>
</html>
